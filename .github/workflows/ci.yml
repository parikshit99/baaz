name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pushes to a pull request cancel the older run; main never cancels.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rules:
    name: REVIEW.md rules and complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: REVIEW.md checks (R5, R6, R8, R13, R14, R17)
        run: python tools/check_rules.py
      - name: Function complexity (R7)
        run: |
          python -m pip install lizard==1.17.13
          python -m lizard addon/src tests -C 12 -m -w -W whitelizard.txt

  build:
    name: Build add-on and run tests
    needs: rules
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-devkit
      - name: Configure (warnings are errors)
        run: cmake -S . -B build -DARCHICAD_DEVKIT_DIR="${{ env.ARCHICAD_DEVKIT_DIR }}" -DBAAZ_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Check the add-on was built
        shell: pwsh
        run: if (-not (Test-Path build/addon/Release/Baaz.apx)) { throw "Baaz.apx was not built" }
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
